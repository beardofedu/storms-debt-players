name: Update Gallery

on:
  push:
    paths:
      - 'gallery/**'

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild gallery.html from gallery/ images
        run: |
          # Build the replacement block from image files in gallery/,
          # ordered by the commit date each image was first added and
          # grouped under a header for each distinct date.
          {
            find gallery/ -maxdepth 1 -type f \
              \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \
                 -o -iname '*.gif' -o -iname '*.webp' -o -iname '*.svg' \) \
              -print0 \
              | while IFS= read -r -d '' img; do
                  ts=$(git log --follow --diff-filter=A --format=%at -- "$img" | tail -n 1)
                  if [ -z "$ts" ]; then
                    ts=$(git log -1 --format=%at -- "$img")
                  fi
                  if [ -z "$ts" ]; then
                    ts=$(date +%s)
                  fi
                  date_key=$(date -u -d "@${ts}" +%Y-%m-%d)
                  date_label=$(date -u -d "@${ts}" "+%B %-d, %Y")
                  printf '%s\t%s\t%s\t%s\n' "$ts" "$date_key" "$date_label" "$img"
                done \
              | sort -n -k1,1 \
              > /tmp/gallery_sorted.tsv

            # Count how many photos fall on each date, for the header badge.
            cut -f2 /tmp/gallery_sorted.tsv | sort | uniq -c \
              | awk '{print $2"\t"$1}' > /tmp/gallery_counts.tsv

            echo '      <!-- GALLERY-START (auto-generated — do not edit between these markers) -->'
            echo ''
            echo '      <div class="gallery-timeline">'

            current_date_key=""
            while IFS=$'\t' read -r ts date_key date_label img; do
              if [ "$date_key" != "$current_date_key" ]; then
                if [ -n "$current_date_key" ]; then
                  echo '          </div>'
                  echo '        </div>'
                fi
                count=$(awk -F'\t' -v d="$date_key" '$1==d{print $2}' /tmp/gallery_counts.tsv)
                photo_word="photo"
                [ "$count" != "1" ] && photo_word="photos"
                echo ''
                echo "        <div class=\"gallery-date-group\" data-date=\"${date_key}\">"
                echo "          <h3 class=\"gallery-date-header\">${date_label} <span class=\"gallery-date-count\">${count} ${photo_word}</span></h3>"
                echo '          <div class="gallery-grid">'
                current_date_key="$date_key"
              fi

              filename=$(basename "$img")
              name_raw="${filename%.*}"
              title=$(echo "$name_raw" | sed -E 's/^session-[0-9]+-//' | sed 's/[-_]/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)}1')
              session=$(echo "$name_raw" | grep -oP '^session-\K[0-9]+' || true)

              if [ -n "$session" ]; then
                session_num=$(echo "$session" | sed 's/^0*//')
                session_label="Session ${session_num}"
                alt_text="${title} — ${session_label}"
                session_attr=" data-session=\"${session_label}\""
              else
                session_label=""
                alt_text="${title}"
                session_attr=""
              fi

              echo ""
              echo "            <div class=\"gallery-item\" tabindex=\"0\" role=\"button\" onclick=\"openLightbox(this)\" onkeydown=\"if(event.key==='Enter')openLightbox(this)\"${session_attr} data-date=\"${date_label}\">"
              echo "              <img src=\"${img}\" alt=\"${alt_text}\" loading=\"lazy\" />"
              echo "            </div>"
            done < /tmp/gallery_sorted.tsv

            if [ -n "$current_date_key" ]; then
              echo '          </div>'
              echo '        </div>'
            fi

            echo ''
            echo '      </div>'
            echo ''
            echo '      <!-- GALLERY-END -->'
          } > /tmp/gallery_block.html

          # Replace content between markers using Python
          python3 -c "
          import re
          with open('gallery.html') as f:
              content = f.read()
          with open('/tmp/gallery_block.html') as f:
              block = f.read()
          result = re.sub(
              r'      <!-- GALLERY-START.*?<!-- GALLERY-END -->',
              block.rstrip(),
              content,
              flags=re.DOTALL
          )
          with open('gallery.html', 'w') as f:
              f.write(result)
          "

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gallery.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update gallery with new photos [auto]"
            git push
          fi
